name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cums
          POSTGRES_USER: cums
          POSTGRES_PASSWORD: local-dev-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cums -d cums"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build private storage acceptance fixture
        run: |
          docker build -t cums-backup:local -f deploy/Dockerfile.backup deploy
          docker build -t cums-storage-test:local -f deploy/Dockerfile.storage-test deploy
      - name: Backend tests
        working-directory: backend
        run: bash ./mvnw --batch-mode -Pcontainer-tests,financial-coverage verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          retention-days: 7
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint, test and build
        working-directory: frontend
        run: |
          npm run lint
          npm run test
          npm run build
          npm audit --audit-level=moderate
  browser-accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Responsive browser and WCAG checks
        working-directory: frontend
        run: npm run test:e2e
      - name: Production HEIC conversion and CSP acceptance
        working-directory: frontend
        run: |
          npm run build
          node scripts/heic-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-fixture-results
          path: frontend/artifacts/playwright-results
          retention-days: 7
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t cums-backend:ci backend
      - name: Build frontend image
        run: docker build -t cums-frontend:ci frontend
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: go install github.com/gitleaks/gitleaks/v8@v8.28.0
      - name: Scan Git history
        run: "$(go env GOPATH)/bin/gitleaks git --no-banner --redact --exit-code 1 ."
  backup-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build maintenance image
        run: |
          docker build -t cums-backup:local -f deploy/Dockerfile.backup deploy
          docker build -t cums-storage-test:local -f deploy/Dockerfile.storage-test deploy
      - name: Synthetic encrypted recovery drill
        shell: pwsh
        run: |
          ./scripts/backup-restore-drill.ps1
          ./scripts/backup-restore-drill.ps1 -S3
      - name: Backup retention checks
        run: python3 -m unittest discover -s deploy -p 'test_*.py'
  financial-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare isolated financial acceptance
        run: |
          docker compose up -d --wait postgres
          cd backend && bash ./mvnw --batch-mode -DskipTests package
          cd ../frontend && npm ci && npx playwright install --with-deps chromium
      - name: Real financial and mobile receipt browser acceptance
        shell: pwsh
        run: |
          $env:CUMS_CHROME_PATH = node --input-type=module -e "import {chromium} from './frontend/node_modules/playwright-core/index.mjs'; console.log(chromium.executablePath())"
          ./scripts/financial-acceptance.ps1
      - name: Stop disposable services
        if: always()
        run: docker compose down -v
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: OWASP high-severity dependency gate
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bash ./mvnw --batch-mode -Psecurity-audit -DskipTests verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: backend/target/dependency-check-report.*
          retention-days: 7
